name: Release

# yamllint disable-line rule:truthy
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version part to bump, or auto to read the commit messages
        required: false
        default: auto
        type: choice
        options:
          - auto
          - patch
          - minor
          - major
      initial_version:
        description: Version to release when there is no release tag yet
        required: false
        default: ""
        type: string
      dry_run:
        description: Work out the next version without publishing a release
        required: false
        default: false
        type: boolean

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Publish release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release: ${{ steps.version.outputs.release }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The whole history and every tag, the next version is worked out
          # from the commits since the most recent release tag.
          fetch-depth: 0
          fetch-tags: true
          # The version is committed back to the branch before it is tagged.
          persist-credentials: true

      - name: Work out the next version
        id: version
        env:
          BUMP: ${{ inputs.bump || 'auto' }}
          INITIAL_VERSION: ${{ inputs.initial_version }}
        run: |
          python3 .github/scripts/next_version.py \
            --bump "${BUMP}" \
            --initial-version "${INITIAL_VERSION}" \
            --notes-file release-notes.md

      - name: Summarise
        if: steps.version.outputs.release == 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
          BUMP: ${{ steps.version.outputs.bump }}
          COMMITS: ${{ steps.version.outputs.commits }}
          PREVIOUS_TAG: ${{ steps.version.outputs.previous_tag }}
        run: |
          {
            echo "## ${TAG} (${BUMP})"
            echo
            echo "${COMMITS} commits since ${PREVIOUS_TAG:-the start of the history}."
            echo
            cat release-notes.md
          } >> "$GITHUB_STEP_SUMMARY"

      # HACS downloads the source of the tagged commit, so the version the
      # integration reports is whatever the manifest holds at that commit.
      # The packaging metadata declares the same version, and the script keeps
      # the two in step.
      - name: Commit the released version
        id: commit
        if: steps.version.outputs.release == 'true' && inputs.dry_run != true
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          python3 .github/scripts/set_version.py "${VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          # The checkout is otherwise untouched, so the only tracked files
          # that differ are the ones the script rewrote. The release notes are
          # untracked and stay out of the commit.
          if git diff --quiet; then
            echo "The version files already declare ${VERSION}."
          else
            git commit --all --message "chore(release): ${TAG}"
            # Pushed with GITHUB_TOKEN, which does not start another run.
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Create the release
        if: steps.version.outputs.release == 'true' && inputs.dry_run != true
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          TARGET: ${{ steps.commit.outputs.sha }}
        run: |
          gh release create "$TAG" \
            --target "$TARGET" \
            --title "$TAG" \
            --notes-file release-notes.md
